[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Kudio"
description = "Audio toolkit for industrial acoustic inspection: I/O, streaming, feature extraction, noisy-data synthesis, enhancement and evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "RL" }]
keywords = ["audio", "acoustic", "signal-processing", "speech-enhancement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
# Core stays light: numpy + soundfile + librosa cover I/O and features.
# Heavy or niche deps (plotting, dataframes, metrics, live audio) are extras.
dependencies = [
    # The ceiling is numba's, not ours: librosa pulls numba in, and numba caps
    # numpy at <2.6 from 0.67 onwards (0.66 and earlier said <2.5). Asking for
    # a numpy above numba's own bound only hands pip an unsolvable problem, so
    # this follows it and moves when it moves.
    "numpy>=1.24,<2.6",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "PyYAML>=6.0",
    "tqdm>=4.60",
    "PyWavelets>=1.4",
]

[project.optional-dependencies]
audio = ["PyAudio>=0.2.13", "sounddevice>=0.4.5"]     # live capture / playback
# bss_eval_sources, which `sdr` calls, is deprecated in mir_eval 0.8 and
# announced for removal in 0.9, so the upper bound is load-bearing rather than
# caution.
eval = ["mir_eval>=0.7,<0.9", "pystoi>=0.3.3"]  # STOI / SDR (PESQ: see [pesq])
# PESQ (ITU-T P.862 / P.862.2). PyPI carries `pesq` as source only, so this
# compiles it: it needs a C compiler -- the MSVC Build Tools on Windows. That
# is why it is an extra of its own and not part of [eval] or [all], which
# would otherwise stop installing on a machine without one.
pesq = ["pesq>=0.0.4"]
dnsmos = ["onnxruntime>=1.15"]      # DNSMOS P.835 (weights are NOT bundled --
                                    # see kudio.find_dnsmos_model)
viz = ["matplotlib>=3.7"]                              # plotting helpers
data = ["pandas>=2.0", "openpyxl>=3.1"]                # Excel / dataframe export
# every runtime extra except [pesq], which compiles. [check], [dev] and [docs]
# are for working on kudio rather than using it, so they stay out too.
all = ["kudio[audio,eval,dnsmos,viz,data]"]
dev = ["pytest>=7.0", "kudio[data]"]   # [data] lets the full test suite run
# Independent implementations the suite measures itself against. Nothing in
# kudio imports these; they are here so test_loudness can hold our own BS.1770
# meter against someone else's. Separate from [dev] because [dev] has to stay
# small enough to install anywhere, while CI can afford this.
check = ["pyloudnorm>=0.1"]
# The toolchain mkdocs.yml needs. MkDocs stays below 2.0, which drops the
# plugin system Material and mkdocstrings are built on. mkdocstrings-python 2.0
# is a real floor: it brings the griffe that tools/docs/griffe_markdown.py hooks
# into. ruff is only there so mkdocstrings can wrap long signatures.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings>=1.0", "mkdocstrings-python>=2.0", "mkdocs-static-i18n>=1.2", "jieba", "ruff"]

[project.scripts]
kudio = "kudio.cli:main"

[project.urls]
Homepage = "https://github.com/recklight/kudio"
Repository = "https://github.com/recklight/kudio"
Issues = "https://github.com/recklight/kudio/issues"
# Branch name matters here: this repository's default branch is master, and a
# /blob/main/ link is a 404 that PyPI then publishes for good. Anything added
# below that names a branch names master too.
Changelog = "https://github.com/recklight/kudio/blob/master/CHANGELOG.md"
Documentation = "https://recklight.github.io/Kudio/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "kudio._version.__version__" }

[tool.setuptools.packages.find]
include = ["kudio*"]

[tool.setuptools.package-data]
kudio = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
