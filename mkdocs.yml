site_name: Kudio
site_description: Lightweight, composable audio toolkit for acoustic inspection
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - API Reference: api.md

# build docs with:  pip install mkdocs-material mkdocstrings[python]; mkdocs serve
