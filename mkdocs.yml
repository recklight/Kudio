site_name: Kudio
site_description: Lightweight, composable audio toolkit for acoustic inspection
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            # Sphinx, not Google: every docstring in this library uses
            # `:param x:`. Declared as google, mkdocstrings rendered
            # each parameter block as raw prose instead of a table.
            docstring_style: sphinx
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - API Reference: api.md

# build docs with:  pip install mkdocs-material mkdocstrings[python]; mkdocs serve
