name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        # ubuntu-latest is 26.04, for which setup-python has no 3.9 (its
        # builds of 3.9.25 are for 22.04 and 24.04), so 3.9 on Linux runs
        # on 24.04
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        run: pytest -q

  oldest:
    # Every floor pyproject.toml names, all at once. pip leaves a release that
    # is there already alone, so someone with an old scientific stack runs on
    # these, and a floor nobody runs is a claim.
    runs-on: ubuntu-24.04            # the last with a Python 3.9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: PortAudio, for sounddevice
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Install the oldest of everything
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.*" "scipy==1.10.*" "soundfile==0.12.*" \
                      "soxr==0.3.2" "PyYAML==6.0" "tqdm==4.60.*" \
                      "matplotlib==3.7.*" "pandas==2.0.*" "openpyxl==3.1.*" \
                      "sounddevice==0.4.5"
          pip install -e .[dev,viz,audio]
      - name: What is installed is what was asked for
        run: |
          pip list
          python -c "import numpy, scipy; assert numpy.__version__.startswith('1.24.') and scipy.__version__.startswith('1.10.')"
      - name: Run tests
        run: pytest -q

  librosa:
    # tests/test_against_librosa.py, which holds what kudio computes against what
    # librosa does: to the bit, for the most part, and test_against_pywavelets.py,
    # the wavelet filter against PyWavelets, to the bit. kudio uses neither, and
    # on the other legs but backends these tests skip.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # with no librosa, or with another, the run stops: a job of nothing but
      # skips would pass and prove nothing
      KUDIO_REQUIRE_LIBROSA: ${{ matrix.librosa }}
      KUDIO_REQUIRE_PYWAVELETS: "1"
      KUDIO_REQUIRE_MIR_EVAL: "1"
      KUDIO_REQUIRE_PYSTOI: "1"
      # every case before a release, and a sample of them on a push
      KUDIO_LIBROSA_CASES: ${{ startsWith(github.ref, 'refs/tags/v') && 'all' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", librosa: "0.11"}
          - {os: ubuntu-latest, python-version: "3.13", librosa: "1.0"}
          - {os: windows-latest, python-version: "3.13", librosa: "1.0"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with librosa ${{ matrix.librosa }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,viz,check] "librosa==${{ matrix.librosa }}.*"
      - name: Compare
        run: pytest -rs tests/test_against_librosa.py tests/test_against_pywavelets.py tests/test_against_mir_eval.py tests/test_against_pystoi.py

  backends:
    # The one leg where the optional metric back-ends are really installed.
    # [dev] is deliberately small, so on the legs above, the mir_eval and
    # pystoi calls in kudio/core/evaluator.py never run -- which leaves the
    # mir_eval <0.9 bound (0.8 deprecates bss_eval_sources, 0.9 removes it) a
    # claim nothing tries. matplotlib and onnxruntime come along so that
    # kudio.util.visual and the DNSMOS path get imported for real and not only
    # through their missing-dependency branch, and pyloudnorm so the BS.1770
    # cross-check in test_loudness runs somewhere rather than nowhere.
    #
    # [audio] is sounddevice, which needs the system's PortAudio and finds no
    # sound card here: it imports, lists nothing, and the device code runs
    # against that. Left out: [pesq], which ships no wheel and wants a C
    # compiler, so that one failed source build cannot take the rest with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: PortAudio, for sounddevice
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2
      - name: Install (with the optional back-ends)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,eval,dnsmos,viz,check,audio]
      - name: Run tests
        run: pytest -q

  compressed:
    # m4a, aac, webm and the rest of what soundfile does not read, against a
    # real ffmpeg. On the legs above the tests of it run on a stand-in for
    # audioread alone.
    runs-on: ubuntu-latest
    env:
      # a test that skips for want of ffmpeg or audioread fails instead: a job
      # whose every real file skipped would otherwise pass and prove nothing
      KUDIO_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install with audioread
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,viz,compressed]
      - name: Read every compressed format (they must run, not skip)
        run: pytest -rs tests/test_compressed.py

  docs:
    # The documentation site, built strict on every push and pull request: a
    # docstring that breaks the build, or a link to something that no longer
    # exists, fails here instead of on the live site. Only a push to master
    # hands the result to the pages job. publish does not wait for this one --
    # a broken page is no reason to hold back a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with the docs toolchain)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
      - name: Build
        run: mkdocs build --strict
      - name: Hand the site to the pages job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    # Publishes https://recklight.github.io/Kudio/. Needs Settings -> Pages ->
    # Source set to "GitHub Actions" once; until then this job fails and
    # nothing else does.
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one deployment at a time, and a newer push waits rather than cancelling
    # one that is halfway out
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  publish:
    # build sdist+wheel and upload to PyPI when a v* tag is pushed
    needs: [test, oldest, librosa, backends, compressed]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing (no API token in secrets)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Tag matches kudio/_version.py
        # The tag and the code come from the same commit, so this cannot catch
        # uploading something other than what was tested. What it catches is a
        # mislabeled tag: v3.8.0 cut from a tree that still says 3.7.1. Worth
        # a step of its own because PyPI never lets a version number be reused
        # once it has been published.
        #
        # The version is read out of the file rather than imported: nothing is
        # installed this early in the job, so `import kudio` would go looking
        # for numpy and fail for the wrong reason.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(sed -n 's/^__version__ = "\([^"]*\)".*$/\1/p' kudio/_version.py)
          if [ -z "$version" ]; then
            echo "found no __version__ = \"...\" line in kudio/_version.py to check the tag against." >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match kudio/_version.py, which says $version." >&2
            echo "Move the tag onto a commit whose _version.py says $tag, or bump _version.py and tag again." >&2
            exit 1
          fi
          echo "releasing $version"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the built metadata
        run: twine check --strict dist/*
      - name: Import every module out of the built wheel
        # twine check reads metadata and imports nothing, so a module that
        # raises on import -- an optional dependency escaping its gate, a typo
        # in a corner of the tree no test reaches -- goes straight to PyPI.
        # The walk runs from outside the checkout, so `import kudio` can only
        # resolve to the wheel that was just installed, and the wheel goes in
        # bare, with no extras in sight.
        #
        # On a bare install every module has to do one of two things: import,
        # or refuse with kudio's DependencyError naming the extra it needs.
        # The second is the gate working -- kudio.util.visual is all plotting,
        # so it asks for [viz] on import rather than on every call. Anything
        # else, a bare ModuleNotFoundError above all, is a dependency that got
        # past its gate, and that is what fails the release.
        run: |
          python -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/import-walk"
          cd "$RUNNER_TEMP/import-walk"
          python - <<'PY'
          import importlib
          import pkgutil

          import kudio
          from kudio.exceptions import DependencyError

          broken, gated = [], []
          for found in pkgutil.walk_packages(kudio.__path__, kudio.__name__ + "."):
              try:
                  importlib.import_module(found.name)
              except DependencyError as exc:
                  gated.append("{}: {}".format(found.name, exc))
              except Exception as exc:
                  broken.append("{}: {}: {}".format(found.name, type(exc).__name__, exc))

          for line in gated:
              print("gated behind an extra, as it should be --", line)
          if broken:
              raise SystemExit(
                  "these modules do not import from a plain install of the wheel:\n  "
                  + "\n  ".join(broken)
                  + "\nMove the optional import inside the function that needs it."
              )
          print("every module under kudio imports from the wheel or names its extra")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
